<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Подпись игры одним знаком: сфера, освещённая сбоку. Именно так выглядит
       в «Дрейфе» любая планета, и именно это переживает 16 пикселей — две
       сплошные формы без обводок, пунктиров и вложенных кругов.
       Подложки нет намеренно: значок ложится и на светлую вкладку, и на тёмную,
       поэтому ночная сторона взята средним тоном, а не почти чёрным. -->
  <circle cx="16" cy="16" r="12.5" fill="#143a45"/>
  <!-- дневная сторона: полудиск, внутренний край — эллипс, то есть терминатор -->
  <path d="M16 3.5A12.5 12.5 0 0 1 16 28.5A3 12.5 0 0 0 16 3.5Z" fill="#7fe6d8"/>
</svg>
