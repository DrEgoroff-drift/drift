# Каждый push в main пересобирает игру и выкладывает её на drift-game.ru.
#
# Сборка идёт тем же build.ps1, что и на машине разработчика: на ubuntu-раннере
# уже стоит PowerShell Core, а скрипт не использует ничего windows-специфичного.
# Двух разных сборщиков быть не должно — иначе однажды они разойдутся, и
# выяснится это на сайте.
#
# Заглавная страница переживает выкладку: игра лежит отдельным файлом play.html,
# а index.html меняется только когда меняется сам site/index.html.
#
# Нужен один секрет репозитория:
#   DRIFT_SSH_KEY — содержимое приватного ключа ~/.ssh/drift (весь файл целиком,
#                   вместе со строками BEGIN и END)

name: deploy

on:
  push:
    branches: ['**', '!claude/**']   # 0.359.3: ветка едет на dev.html, main — на play.html;
                                      # 25.09: claude/** — облачные сеансы, не выкладываются и не рвут выкладку main
    paths:
      - 'src/**'
      - 'site/**'
      - 'tests/**'
      - 'build.ps1'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  publish:
    needs: webgpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build drift.html
        shell: pwsh
        run: ./build.ps1

      # Птица в объёме — своя сборка из bird/. Файл лежит в репозитории (его
      # можно открыть двойным кликом из клона), но собирается заново и здесь:
      # иначе однажды уедет вчерашняя птица от сегодняшних исходников.
      - name: Build site/treplo3d.html
        shell: pwsh
        run: ./bird.ps1

      - name: Check that the build is not empty
        run: |
          test -s drift.html || { echo "drift.html is empty"; exit 1; }
          size=$(stat -c%s drift.html)
          echo "build: $size bytes"
          # порог грубый, но ловит главное — склейку, потерявшую половину модулей
          [ "$size" -gt 1000000 ] || { echo "the build is suspiciously small"; exit 1; }

      # 0.359.1: сборка 0.359.0 уехала на сайт мёртвой — TDZ на верхнем уровне,
      # игра остановилась на 29-й тысяче строк. Открываем tests.html в headless
      # Chrome (на раннере он есть) и не выкладываем, если в консоли Uncaught.
      - name: Check that the build loads without Uncaught
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --user-data-dir=/tmp/drift-chk --enable-logging=stderr --v=0 --virtual-time-budget=8000 --dump-dom "file://$PWD/tests.html" 2>/tmp/chrome.log >/dev/null || true
          if grep -i "CONSOLE" /tmp/chrome.log | grep -v "DRIFT:" | grep -q "Uncaught"; then
            grep -i "Uncaught" /tmp/chrome.log | head -5
            echo "the build crashes on load — no deploy"; exit 1
          fi
          echo "load is clean"

      # 0.359.3: тесты гоняются ЗДЕСЬ, на том файле, что уедет, а не только дома.
      # Быстрый ярус (~40 с; автор 06.09: «не нужны тесты на 4 минуты»), полный — руками test.ps1 -Full. Красный —
      # выкладки нет. Первый набор — «игра запустилась сама», data-alive на корне.
      # 0.359.3: тесты — на том файле, что уедет. Ярус Node (формулы и данные, ~5 с)
      # плюс дым в Хроме: страница открылась, кадр прожил, сторож молчит (~3 с).
      # Картинка и интерфейс — руками, test.ps1 -Browser / -Full.
      - name: "Autotests: Node and a Chrome smoke"
        run: |
          node --version
          node test-node.js
          google-chrome --headless=new --disable-gpu --no-sandbox --window-size=1280,800 --user-data-dir=/tmp/drift-smoke --virtual-time-budget=20000 --timeout=600000 --dump-dom "file://$PWD/tests.html?only=%D0%B8%D0%B3%D1%80%D0%B0%20%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D1%82%D0%B8%D0%BB%D0%B0%D1%81%D1%8C" > /tmp/smoke.dom 2>/tmp/smoke.err || true
          python3 - <<'PY'
          import re,html,sys
          d=open('/tmp/smoke.dom',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="testout"[^>]*>([\s\S]*?)</pre>',d)
          if not m: print("smoke: no report — the page died before runTests"); sys.exit(1)
          t=html.unescape(m.group(1)).split(chr(10)); print("smoke: "+t[0])
          if re.match(r'^\S+ \d+ ',t[0]):
              for l in t[2:12]:
                  if not l.strip(): break
                  print(l)
              sys.exit(1)
          PY

      - name: Check api.php syntax
        run: |
          # На машине разработчика PHP нет вовсе (CLAUDE.md: ни node, ни python),
          # то есть единственный файл бэкенда до сих пор уезжал на боевой сайт
          # ни разу не разобранным. Одна опечатка в нём — и это не «страница
          # съехала», а лежат учётные записи и облачные сохранения у живых людей:
          # проверка ниже (a=me → 401) ловит беду ПОСЛЕ выкладки, когда файл уже
          # там. На раннере PHP есть всегда — разбираем до заливки.
          php -v | head -1
          php -l site/api.php || { echo "api.php does not parse — no deploy"; exit 1; }
          php -l site/war.php || { echo "war.php does not parse — no deploy"; exit 1; }

      - name: Deploy key
        env:
          KEY: ${{ secrets.DRIFT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/drift
          chmod 600 ~/.ssh/drift
          # Хост отдаёт только старый ssh-rsa ключ — современный OpenSSH
          # отказывается с ним говорить, пока его об этом не попросят явно.
          cat >> ~/.ssh/config <<'EOF'
          Host drift
              HostName ssh.dri7887661.nichost.ru
              User dri7887661
              IdentityFile ~/.ssh/drift
              IdentitiesOnly yes
              HostKeyAlgorithms +ssh-rsa
              PubkeyAcceptedAlgorithms +ssh-rsa
              StrictHostKeyChecking accept-new
              # Хост подписывает «докажи ключи» (UpdateHostKeys) старым ssh-rsa, и
              # клиент печатает «bad signature for RSA key 0» шесть раз за выкладку
              # (09.10.2026). Нам чужие ключи обновлять незачем — выключить.
              UpdateHostKeys no
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          # version.json пишет тот, кто выкладывает: заглавная показывает не то,
          # что лежит в исходниках, а то, что действительно уехало на сайт.
          ver=$(grep -o 'VER="[0-9.]*"' src/01-core.js | head -1 | grep -o '[0-9.]*')
          printf '{"ver":"%s","date":"%s"}\n' "$ver" "$(date -u +%d.%m.%Y)" > version.json
          # сайт уезжает целиком: страниц и картинок больше одной, и перечислять
          # их по именам — способ однажды забыть новую
          ssh drift "mkdir -p drift-game.ru/docs/shots drift-game.ru/docs/icons"
          scp -r site/*         drift:drift-game.ru/docs/
          # glob не берёт точечные файлы, а .htaccess — сжатие и кэш (см. DEPLOY.md)
          scp site/.htaccess    drift:drift-game.ru/docs/.htaccess
          scp version.json      drift:drift-game.ru/docs/version.json
          # прежняя игра остаётся рядом как play.prev.html — на откат, если сайт не оживёт
          ssh drift "cd drift-game.ru/docs && { cp -f play.html play.prev.html; cp -f play.html.gz play.prev.html.gz; } 2>/dev/null || true"
          scp drift.html        drift:drift-game.ru/docs/play.html
          # mod_deflate на хосте нет: рядом кладётся play.html.gz, .htaccess отдаёт его
          ssh drift "cd drift-game.ru/docs && gzip -kf9 play.html"

      - name: Make sure the site serves what was built
        if: github.ref == 'refs/heads/main'
        run: |
          # Хост временами рвёт TLS-рукопожатие с раннеров (curl: 35), а шаг идёт
          # под pipefail — одна сорвавшаяся попытка не должна валить проверку.
          # Поэтому каждый запрос — через повтор, и ни один curl не фатален сам по себе.
          hc(){ local c; for i in 1 2 3 4; do
                  c=$(curl -s --max-time 40 -o /dev/null -w '%{http_code}' "$@" || true)
                  [ -n "$c" ] && [ "$c" != "000" ] && { echo "$c"; return; }; sleep 8; done
                echo 000; }
          want=$(grep -o 'VER="[0-9.]*"' src/01-core.js | head -1)
          got=""
          for i in 1 2 3 4 5 6; do
            got=$(curl -s --max-time 90 -H 'Cache-Control: no-cache' "https://drift-game.ru/play.html?v=$RANDOM" | grep -o 'VER="[0-9.]*"' | head -1 || true)
            [ "$want" = "$got" ] && break
            echo "attempt $i: the site has ${got:-nothing}, waiting..."; sleep 15
          done
          echo "sources have $want, the site has $got"
          [ "$want" = "$got" ] || { echo "versions differ"; exit 1; }
          gz=$(curl -s --max-time 60 -H 'Accept-Encoding: gzip' -o /dev/null -w '%{size_download}' https://drift-game.ru/play.html || true); gz=$((gz+0))
          raw=$(stat -c %s drift.html)
          echo "play.html compressed: $gz bytes of $raw raw"
          # порог — доля от сырого файла, а не число: 1.2 МБ было «сжато» для игры
          # на 2 МБ и стало «не сжато» для игры на 9.9 МБ (0.493.1: 3.24 МБ .gz, и
          # это нормальные 33 %)
          [ "$gz" -gt 0 ] && [ "$gz" -ge $((raw*8/10)) ] && echo "::warning::play.html goes out uncompressed ($gz of $raw bytes) — check .htaccess"
          [ "$(hc https://drift-game.ru/)" = "200" ] || { echo "the front page does not answer"; exit 1; }
          code=$(hc -X POST 'https://drift-game.ru/api.php?a=me')
          [ "$code" = "401" ] || { echo "api.php answers $code instead of 401"; exit 1; }
          # война (M376): pull открыт всем и обязан отвечать номером сводки
          war=$(curl -s --max-time 30 -X POST 'https://drift-game.ru/war.php?a=pull' -d '{"since":-1}' || true)
          echo "war.php pull: $(echo "$war" | head -c 120)"
          echo "$war" | grep -q '"ok":true' || { echo "war.php does not answer ok"; exit 1; }
          # страницы и их ассеты: битая картинка на заглавной — тоже поломка выкладки
          for u in mechanics.html parrot.html reset.html treplo.html treplo3d.html site.css sky.js planets.js \
                   auth.js parrot.js favicon.svg og.jpg shots/world.webp shots/land.webp \
                   shots/bird3d.webp shots/road.webp \
                   icons/parrot-512.png icons/fav-32.png parrot.webmanifest \
                   treplo3d.webmanifest treplo3d-sw.js \
                   drift.webmanifest drift-sw.js; do
            c=$(hc "https://drift-game.ru/$u")
            [ "$c" = "200" ] || { echo "/$u answers $c"; exit 1; }
          done

      # 0.359.3: после выкладки спросить САЙТ, а не себя: тот ли файл лежит
      # (md5) и живёт ли он — тридцать кадров без сбоя ставят data-alive=VER.
      - name: Live site after the deploy
        if: github.ref == 'refs/heads/main'
        run: |
          ver=$(grep -o 'VER="[0-9.]*"' src/01-core.js | head -1 | tr -d 'VER="')
          curl -s -m 120 https://drift-game.ru/play.html -o /tmp/live.html
          if ! cmp -s /tmp/live.html drift.html; then echo "the site holds a different build"; exit 1; fi
          rm -rf /tmp/drift-live
          google-chrome --headless=new --disable-gpu --no-sandbox --window-size=1280,800 --user-data-dir=/tmp/drift-live --virtual-time-budget=6000 --dump-dom "https://drift-game.ru/play.html" > /tmp/live.dom 2>/tmp/live.err || true
          if grep -q "data-alive=\"$ver\"" /tmp/live.dom; then echo "the site is alive: $ver"; else echo "the site did not come alive: no data-alive=$ver"; grep -i "uncaught" /tmp/live.err | head -3;
            ssh drift "cd drift-game.ru/docs && test -s play.prev.html && cp -f play.prev.html play.html && gzip -kf9 play.html" && echo "::error::rolled back to the previous play.html" || echo "::error::no rollback: play.prev.html is missing"
            exit 1; fi

      # Ветка, не main: та же сборка и те же тесты, но уезжает только в dev.html —
      # посмотреть на телефоне до слияния. play.html, заглавная и api.php не трогаются.
      - name: Branch to dev.html
        if: github.ref != 'refs/heads/main'
        run: |
          scp drift.html drift:drift-game.ru/docs/dev.html
          ssh drift "cd drift-game.ru/docs && gzip -kf9 dev.html"
          ver=$(grep -o 'VER="[0-9.]*"' src/01-core.js | head -1 | tr -d 'VER="')
          rm -rf /tmp/drift-dev
          google-chrome --headless=new --disable-gpu --no-sandbox --window-size=1280,800 --user-data-dir=/tmp/drift-dev --virtual-time-budget=6000 --dump-dom "https://drift-game.ru/dev.html" > /tmp/dev.dom 2>/tmp/dev.err || true
          grep -q "data-alive=\"$ver\"" /tmp/dev.dom && echo "https://drift-game.ru/dev.html is alive: $ver ($GITHUB_REF_NAME)" || { echo "dev.html did not come alive"; grep -i uncaught /tmp/dev.err | head -3; exit 1; }

  # 26.09 (Контроль): глаза тестов на WebGPU — SwiftShader, программная видеокарта,
  # что едет с самим Хромом. Дома: дым + «глаза тестов» 8/8 зелёных подряд, 9–12 с на прогон.
  # 27.09: 7 из 7 зелёных на выкладках (1268ea91 … f26a1aeb) — работа стала блокирующей:
  # publish ждёт её (needs: webgpu), красная останавливает выкладку, continue-on-error снят.
  webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build tests.html
        shell: pwsh
        run: ./build.ps1

      - name: "WebGPU eyes (SwiftShader), report only"
        run: |
          t0=$(date +%s)
          google-chrome --headless=new --no-sandbox --enable-unsafe-webgpu --enable-features=Vulkan --use-webgpu-adapter=swiftshader --window-size=1280,800 --user-data-dir=/tmp/drift-webgpu --virtual-time-budget=20000 --timeout=600000 --dump-dom "file://$PWD/tests.html?only=%D0%B8%D0%B3%D1%80%D0%B0%20%D0%B7%D0%B0%D0%BF%D1%83%D1%81%D1%82%D0%B8%D0%BB%D0%B0%D1%81%D1%8C%20%D1%81%D0%B0%D0%BC%D0%B0%7C%D0%B3%D0%BB%D0%B0%D0%B7%D0%B0%20%D1%82%D0%B5%D1%81%D1%82%D0%BE%D0%B2" > /tmp/webgpu.dom 2>/tmp/webgpu.err || true
          echo "step: $(( $(date +%s) - t0 )) s"
          python3 - <<'PY'
          import re,html,sys
          d=open('/tmp/webgpu.dom',encoding='utf-8',errors='replace').read()
          m=re.search(r'<pre id="testout"[^>]*>([\s\S]*?)</pre>',d)
          if not m: print("webgpu: no report — the page died before runTests"); sys.exit(1)
          t=html.unescape(m.group(1)).split(chr(10)); print("webgpu: "+t[0])
          if re.match(r'^\S+ \d+ ',t[0]):
              for l in t[2:12]:
                  if not l.strip(): break
                  print(l)
              sys.exit(1)
          PY
